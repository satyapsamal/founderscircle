<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founders Circle</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Premium Font Fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --white: #ffffff;
            --pastel-gradient: linear-gradient(45deg, #FFB7B2, #B2B2FF, #B2E2FF, #B2FFD6, #FFE0B2, #FFFFB2);
            --easing: cubic-bezier(0.2, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: "Parmigiano Headline", "Playfair Display", serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            /* Creates enough room for smooth scroll progress */
            height: 800vh; 
        }

        body.locked {
            overflow: hidden;
        }

        /* Branding Layer: Opening 5s logic */
        #brand-layer {
            position: fixed;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        .main-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 400;
            text-align: center;
            color: white;
            transition: transform 2.2s var(--easing), font-size 2.2s var(--easing), opacity 1.5s ease;
        }

        .main-title.upwards {
            transform: translateY(calc(-50vh + 60px));
            font-size: 1.3rem;
            opacity: 0.4;
        }

        /* Fluid Gradient - Only used for "you." now */
        .gradient-text {
            background: var(--pastel-gradient);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fluidPastel 8s ease infinite;
            display: inline-block;
        }

        @keyframes fluidPastel {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main Cinematic Viewport */
        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .scene {
            position: absolute;
            width: 85%;
            max-width: 1000px;
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 3.8rem);
            line-height: 1.2;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .scene.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Scroll Instruction */
        #scroll-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: -apple-system, system-ui, sans-serif;
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 1001;
        }

        /* Link Section */
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            text-align: left;
        }

        .cta-link {
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0.5;
            transition: opacity 0.4s ease, transform 0.4s ease;
            cursor: pointer;
            pointer-events: none;
        }

        .cta-link:hover {
            opacity: 1;
            transform: translateX(10px);
        }

        .cta-text { font-size: clamp(1.5rem, 4vw, 3rem); }

        .arrow-icon {
            width: clamp(30px, 5vw, 55px);
            height: auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.2;
            transform: rotate(-45deg); /* Default: North East */
            transition: transform 0.5s var(--easing);
        }

        .cta-link:hover .arrow-icon {
            transform: rotate(0deg); /* Hover: East */
        }

        @media (max-width: 768px) {
            .main-title.upwards { transform: translateY(calc(-50vh + 50px)); }
            .scene { width: 90%; }
        }
    </style>
</head>
<body class="locked">

    <div id="brand-layer">
        <h1 id="main-brand" class="main-title">Founders Circle</h1>
    </div>

    <div id="scroll-hint">Scroll to explore</div>

    <div class="viewport" id="main-viewport">
        <div class="scene" id="s1">Student-led community</div>
        <div class="scene" id="s2">For startup founders.</div>
        <div class="scene" id="s3">For aspiring founders.</div>
        <div class="scene" id="s4">For those looking to build, learn, and connect.</div>
        <div class="scene" id="s5">For <span class="gradient-text">you.</span></div>
        
        <div id="s6" class="scene app-container">
            <a href="https://forms.gle/46pUQXhHyNtew1s47" target="_blank" class="cta-link interactive">
                <span class="cta-text">Application Link</span>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
            </a>
            <a href="founderscircle.pdf" download="founderscircle.pdf" class="cta-link interactive">
                <span class="cta-text">Cohort Profile</span>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
            </a>
        </div>
    </div>

    <script>
        const brand = document.getElementById('main-brand');
        const hint = document.getElementById('scroll-hint');
        const viewport = document.getElementById('main-viewport');
        const scenes = document.querySelectorAll('.scene');
        const interactives = document.querySelectorAll('.interactive');

        // 1. INTRO SEQUENCE
        // Show "Founders Circle" in white for 5 seconds, then move up
        window.addEventListener('load', () => {
            window.scrollTo(0, 0);
            
            setTimeout(() => {
                brand.classList.add('upwards');
                
                setTimeout(() => {
                    document.body.classList.remove('locked');
                    hint.style.opacity = '1';
                }, 1000); // Wait for title movement to finish before allowing scroll
            }, 5000); 
        });

        // 2. SMOOTH SCROLL ENGINE
        // This maps the window scroll position to scene indices for a "liquid" flow
        function updateExperience() {
            const scrollY = window.scrollY;
            const vh = window.innerHeight;
            
            // Adjust this for "scroll sensitivity"
            // Higher number = more scrolling required to move scenes
            const scrollStep = vh * 1.2; 
            
            const totalScrollHeight = document.documentElement.scrollHeight - vh;
            
            // Manage Scroll Hint (Hides at the very end)
            if (scrollY > totalScrollHeight - 150) {
                hint.style.opacity = '0';
            } else if (scrollY > 50) {
                hint.style.opacity = '0.3';
            }

            scenes.forEach((scene, index) => {
                // Calculate scene visibility based on scroll ranges
                const startPoint = (index + 0.5) * scrollStep;
                const endPoint = startPoint + scrollStep;

                if (scrollY >= startPoint && scrollY < endPoint) {
                    scene.classList.add('active');
                    
                    // Enable clicks ONLY on the last scene
                    if (index === 5) {
                        viewport.style.pointerEvents = 'all';
                        interactives.forEach(link => link.style.pointerEvents = 'all');
                    } else {
                        viewport.style.pointerEvents = 'none';
                        interactives.forEach(link => link.style.pointerEvents = 'none');
                    }
                } else {
                    scene.classList.remove('active');
                }
            });

            // Subtle brand dimming as you reach the CTA
            if (scrollY > scrollStep * 5.5) {
                brand.style.opacity = '0.1';
            } else {
                brand.style.opacity = '0.4';
            }
        }

        // Listen for scroll with requestAnimationFrame for maximum smoothness
        window.addEventListener('scroll', () => {
            requestAnimationFrame(updateExperience);
        }, { passive: true });

        // Reset scroll position on refresh
        window.onbeforeunload = () => window.scrollTo(0, 0);
    </script>
</body>
</html>
