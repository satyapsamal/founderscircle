<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founders Circle</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Premium Editorial Font Fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #080808;
            --white: #ffffff;
            --pastel-gradient: linear-gradient(
                45deg, 
                #FFB7B2, 
                #B2B2FF, 
                #B2E2FF, 
                #B2FFD6, 
                #FFE0B2, 
                #FFFFB2  
            );
            --easing: cubic-bezier(0.65, 0, 0.35, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: "Parmigiano Headline", "Playfair Display", serif;
            overflow-x: hidden;
            height: 950vh; 
            -webkit-font-smoothing: antialiased;
        }

        body.locked {
            overflow: hidden;
        }

        /* Fluid Gradient Text */
        .gradient-text {
            background: var(--pastel-gradient);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fluidPastel 10s ease infinite;
            display: inline-block;
        }

        @keyframes fluidPastel {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Branding Container */
        #brand-layer {
            position: fixed;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        .main-title {
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            font-weight: 400;
            transition: 
                transform 2.5s var(--easing), 
                font-size 2.5s var(--easing),
                opacity 1.5s ease,
                -webkit-text-fill-color 2s ease;
        }

        .main-title.upwards {
            transform: translateY(calc(-50vh + 60px));
            font-size: 1.4rem;
            -webkit-text-fill-color: white;
            opacity: 0.5;
        }

        /* Persistent Scroll Instruction */
        #scroll-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 1001;
            pointer-events: none;
        }

        /* Content Viewport */
        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Globally disabled clicks */
        }

        .scene {
            position: absolute;
            width: 85%;
            max-width: 1000px;
            text-align: center;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1.1;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s var(--easing), transform 1.5s var(--easing);
            will-change: opacity, transform;
            pointer-events: none; /* Scenes are non-clickable by default */
        }

        .scene.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Application Section */
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 60px;
            text-align: left;
            /* pointer-events: all; <-- REMOVED THIS to prevent early clicks */
        }

        .cta-link {
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 24px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.4s ease;
            pointer-events: none; /* Disabled until active */
        }

        .cta-text {
            font-size: clamp(1.8rem, 4vw, 3.5rem);
        }

        .arrow-icon {
            width: clamp(35px, 5vw, 65px);
            height: auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            transform: rotate(-45deg); 
            transition: transform 0.6s var(--easing);
        }

        /* Hover states only work when pointer-events are enabled via JS */
        .cta-link:hover {
            opacity: 1;
        }

        .cta-link:hover .arrow-icon {
            transform: rotate(0deg); 
        }

        @media (max-width: 768px) {
            .main-title.upwards {
                transform: translateY(calc(-50vh + 50px));
            }
            .app-container { gap: 40px; }
        }
    </style>
</head>
<body class="locked">

    <div id="brand-layer">
        <h1 id="main-brand" class="main-title gradient-text">Founders Circle</h1>
    </div>

    <div id="scroll-hint">Scroll to explore</div>

    <!-- The .viewport and .scene now have pointer-events: none by default -->
    <div class="viewport" id="main-viewport">
        <div class="scene" id="s1">Student-led community</div>
        <div class="scene" id="s2">For startup founders.</div>
        <div class="scene" id="s3">For aspiring founders.</div>
        <div class="scene" id="s4">For those looking to build, learn, and connect.</div>
        <div id="s5" class="scene">For <span class="gradient-text">you.</span></div>
        
        <div id="s6" class="scene app-container">
            <a href="https://forms.gle/46pUQXhHyNtew1s47" target="_blank" class="cta-link interactive">
                <span class="cta-text">Application Link</span>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
            </a>
            
            <a href="founderscircle.pdf" download="founderscircle.pdf" class="cta-link interactive">
                <span class="cta-text">Cohort Profile</span>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
            </a>
        </div>
    </div>

    <script>
        const brand = document.getElementById('main-brand');
        const hint = document.getElementById('scroll-hint');
        const viewport = document.getElementById('main-viewport');
        const interactiveLinks = document.querySelectorAll('.interactive');
        const scenes = [
            document.getElementById('s1'),
            document.getElementById('s2'),
            document.getElementById('s3'),
            document.getElementById('s4'),
            document.getElementById('s5'),
            document.getElementById('s6')
        ];

        window.addEventListener('load', () => {
            window.scrollTo(0, 0);
            setTimeout(() => {
                brand.classList.remove('gradient-text');
                brand.classList.add('upwards');
                setTimeout(() => {
                    document.body.classList.remove('locked');
                    hint.style.opacity = '1';
                }, 1200);
            }, 5000); 
        });

        function handleNarrativeScroll() {
            const scrollY = window.scrollY;
            const vh = window.innerHeight;
            const totalHeight = document.documentElement.scrollHeight - vh;
            const step = vh * 1.4; 
            
            if (scrollY > totalHeight - 100) {
                hint.style.opacity = '0';
            } else if (scrollY > 10) {
                hint.style.opacity = '0.4';
            }

            scenes.forEach((scene, index) => {
                const triggerPoint = (index + 0.6) * step;
                const exitPoint = triggerPoint + step;

                if (scrollY >= triggerPoint && scrollY < exitPoint) {
                    scene.classList.add('active');
                    
                    // CRITICAL FIX: Only enable clicking when the last scene is reached
                    if (index === 5) {
                        viewport.style.pointerEvents = 'all';
                        scene.style.pointerEvents = 'all';
                        interactiveLinks.forEach(link => link.style.pointerEvents = 'all');
                    } else {
                        viewport.style.pointerEvents = 'none';
                        scene.style.pointerEvents = 'none';
                        interactiveLinks.forEach(link => link.style.pointerEvents = 'none');
                    }
                } else {
                    scene.classList.remove('active');
                }
            });

            if (scrollY > step * 5.5) {
                brand.style.opacity = '0.15';
            } else {
                brand.style.opacity = '0.5';
            }
        }

        window.addEventListener('scroll', () => {
            requestAnimationFrame(handleNarrativeScroll);
        });

        window.onbeforeunload = () => window.scrollTo(0, 0);
    </script>
</body>
</html>
