<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founders Circle</title>
    
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --white: #ffffff;
            --pastel-gradient: linear-gradient(45deg, #FFB7B2, #B2B2FF, #B2E2FF, #B2FFD6, #FFE0B2, #FFFFB2);
            --easing: cubic-bezier(0.65, 0, 0.35, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: "Parmigiano Headline", "Playfair Display", serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; /* Lock native scroll for cinematic hijacking */
            height: 100vh;
            width: 100vw;
            touch-action: none; 
        }

        /* Opening Title Logic (Static White for 5s) */
        #brand-layer {
            position: fixed;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        .main-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 400;
            text-align: center;
            color: white;
            transition: transform 2.5s var(--easing), font-size 2.5s var(--easing), opacity 1.5s ease;
        }

        .main-title.upwards {
            transform: translateY(calc(-50vh + 60px));
            font-size: 1.3rem;
            opacity: 0.4;
        }

        /* Fluid Gradient for "you." */
        .gradient-text {
            background: var(--pastel-gradient);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fluidPastel 8s ease infinite;
            display: inline-block;
        }

        @keyframes fluidPastel {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Cinematic Content Viewport */
        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .scene {
            position: absolute;
            width: 85%;
            max-width: 1000px;
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 3.8rem);
            line-height: 1.2;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s var(--easing), transform 1.2s var(--easing);
            will-change: opacity, transform;
            pointer-events: none;
        }

        /* Transition States */
        .scene.past {
            opacity: 0;
            transform: translateY(-40px);
        }

        .scene.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Scroll Instruction */
        #scroll-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: -apple-system, system-ui, sans-serif;
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 1001;
        }

        /* Link Section */
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            text-align: left;
        }

        .cta-link {
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0.5;
            transition: opacity 0.4s ease, transform 0.4s ease;
            cursor: pointer;
            pointer-events: none;
        }

        .cta-link:hover {
            opacity: 1;
            transform: translateX(10px);
        }

        .cta-text { font-size: clamp(1.5rem, 4vw, 3rem); }

        .arrow-icon {
            width: clamp(30px, 5vw, 55px);
            height: auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.2;
            transform: rotate(-45deg); 
            transition: transform 0.5s var(--easing);
        }

        .cta-link:hover .arrow-icon {
            transform: rotate(0deg); 
        }

        @media (max-width: 768px) {
            .main-title.upwards { transform: translateY(calc(-50vh + 50px)); }
        }
    </style>
</head>
<body>

    <!-- Persistent Branding -->
    <div id="brand-layer">
        <h1 id="main-brand" class="main-title">Founders Circle</h1>
    </div>

    <!-- Instruction -->
    <div id="scroll-hint">Scroll to explore</div>

    <!-- The Slide Viewport -->
    <div class="viewport" id="main-viewport">
        <div class="scene" id="s0"></div> <!-- Buffer scene for opening -->
        <div class="scene" id="s1">Student-led community</div>
        <div class="scene" id="s2">For startup founders.</div>
        <div class="scene" id="s3">For aspiring founders.</div>
        <div class="scene" id="s4">For those looking to build, learn, and connect.</div>
        <div class="scene" id="s5">For <span class="gradient-text">you.</span></div>
        
        <div id="s6" class="scene app-container">
            <a href="https://forms.gle/46pUQXhHyNtew1s47" target="_blank" class="cta-link interactive">
                <span class="cta-text">Application Link</span>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
            </a>
            <a href="founderscircle.pdf" download="founderscircle.pdf" class="cta-link interactive">
                <span class="cta-text">Cohort Profile</span>
                <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
            </a>
        </div>
    </div>

    <script>
        const brand = document.getElementById('main-brand');
        const hint = document.getElementById('scroll-hint');
        const viewport = document.getElementById('main-viewport');
        const scenes = document.querySelectorAll('.scene');
        const interactives = document.querySelectorAll('.interactive');

        let currentScene = 0;
        let isLocked = true;
        let isAnimating = false;
        const totalScenes = scenes.length;

        /**
         * 1. 5-SECOND OPENING SEQUENCE
         */
        window.addEventListener('load', () => {
            // Force reset to top of logic
            currentScene = 0;
            
            setTimeout(() => {
                // At 5 seconds, move title up
                brand.classList.add('upwards');
                
                // Allow user interaction
                isLocked = false;
                hint.style.opacity = '1';
                
                // Initialize the first text scene
                scenes[0].classList.add('active');
            }, 5000); 
        });

        /**
         * 2. SINGLE-SCROLL NAVIGATION ENGINE
         */
        function navigate(direction) {
            if (isLocked || isAnimating) return;

            if (direction === 'next' && currentScene < totalScenes - 1) {
                isAnimating = true;
                scenes[currentScene].classList.remove('active');
                scenes[currentScene].classList.add('past');
                currentScene++;
                scenes[currentScene].classList.add('active');
            } 
            else if (direction === 'prev' && currentScene > 0) {
                isAnimating = true;
                scenes[currentScene].classList.remove('active');
                currentScene--;
                scenes[currentScene].classList.remove('past');
                scenes[currentScene].classList.add('active');
            }

            if (isAnimating) {
                // UI Changes based on current slide
                if (currentScene === totalScenes - 1) {
                    hint.style.opacity = '0'; // Hide "Scroll to explore" at the end
                    viewport.style.pointerEvents = 'all';
                    interactives.forEach(l => l.style.pointerEvents = 'all');
                    brand.style.opacity = '0.1';
                } else {
                    hint.style.opacity = '1';
                    viewport.style.pointerEvents = 'none';
                    interactives.forEach(l => l.style.pointerEvents = 'none');
                    brand.style.opacity = '0.4';
                }

                // Lock engine until animation completes
                setTimeout(() => {
                    isAnimating = false;
                }, 1200);
            }
        }

        // Desktop: Mouse Wheel
        window.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) < 15) return; 
            if (e.deltaY > 0) navigate('next');
            else navigate('prev');
        }, { passive: true });

        // Mobile: Touch Swiping
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].pageY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].pageY;
            const diff = touchStartY - touchEndY;
            if (Math.abs(diff) > 40) { 
                if (diff > 0) navigate('next');
                else navigate('prev');
            }
        }, { passive: true });

        // Accessibility: Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === ' ') navigate('next');
            if (e.key === 'ArrowUp') navigate('prev');
        });

    </script>
</body>
</html>
